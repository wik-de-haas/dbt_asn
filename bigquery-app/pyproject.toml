[project]
name = "dbt-community"
version = "0.1.0"
description = "BigQuery DBT project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10.2",
    "sqlfluff>=3.4.1",
    "sqlfluff-templater-dbt>=3.4.1",
    "dbt-bigquery>=1.10.2",
    "shandy-sqlfmt[jinjafmt]"
]

[tool.sqlfmt]
line_length = 99
dialect = "polyglot"
check = true
fast = true
quiet = true
verbose = true

[tool.sqlfluff]
config_file = "deployment/scripts/.sqlfluff"
