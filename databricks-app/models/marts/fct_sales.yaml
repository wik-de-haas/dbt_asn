version: 2

models:
  - name: fct_sales
    description: "Sales fact table at order line item grain with keys, dates, and financial metrics for all business analysis"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_number
              - line_item
    columns:
      - name: order_number
        description: "Order identifier (part of composite key with line_item)"
        tests:
          - not_null
      - name: line_item
        description: "Line item number within order (part of composite key with order_number)"
        tests:
          - not_null
      - name: order_date
        description: "Date the order was placed"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivery_date
        description: "Date the order was delivered (null if not yet delivered)"
      - name: order_month
        description: "Month of order date (1-12)"
      - name: order_year
        description: "Year of order date"
      - name: customer_key
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: store_key
        description: "Foreign key to dim_stores (null for unknown stores)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_key
      - name: product_key
        description: "Foreign key to dim_products"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: currency_code
        description: "Transaction currency code"
      - name: exchange_rate
        description: "Exchange rate to USD on order date"
      - name: quantity
        description: "Number of items purchased"
        tests:
          - not_null
      - name: cost_usd
        description: "Total cost in USD (quantity * unit_cost_usd)"
      - name: revenue_usd
        description: "Total revenue in USD (quantity * unit_price_usd)"
      - name: margin_usd
        description: "Margin in USD (revenue_usd - cost_usd)"
      - name: margin_pct
        description: "Margin percentage relative to cost"
      - name: is_delivered
        description: "Flag indicating whether the order line has been delivered"
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
