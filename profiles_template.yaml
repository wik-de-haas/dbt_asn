dbt_community: ## Make sure this matches your project.yaml settings
  target: dev
  outputs:
    dev:
      type: fabric
      driver: 'ODBC Driver 18 for SQL Server'
      server: '<workspace-name>.datawarehouse.fabric.microsoft.com'
      port: 1433
      database: '<your-lakehouse-name>'
      schema: 'dbt_your_name'
      threads: 4
      # Authentication using Service Principal
      authentication: 'cli' # or 'ServicePrincipal'
      # For service_principal auth
      # client_id: '{{ env_var("FABRIC_CLIENT_ID") }}'
      # client_secret: '{{ env_var("FABRIC_CLIENT_SECRET") }}'
      # tenant_id: '{{ env_var("FABRIC_TENANT_ID") }}'
