version: 2

models:
  - name: int__party
    description: Unified party records from both staging sources.
    columns:
      - name: party_id
        description: Primary key for the party record.
        tests:
          - not_null
          - unique
      - name: name
        description: Name of the party.
        tests:
          - not_null
      - name: start_dt
        description: Business validity start date.
      - name: end_dt
        description: Business validity end date.
      - name: birth_dt
        description: Birth date of the party.
      - name: client_number
        description: Source client number.
        tests:
          - not_null
      - name: technical_start_dt
        description: Technical validity start timestamp.
      - name: technical_end_dt
        description: Technical validity end timestamp.