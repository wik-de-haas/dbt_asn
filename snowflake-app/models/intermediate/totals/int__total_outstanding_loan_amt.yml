version: 2

models:
  - name: int__total_outstanding_loan_amt
    description: Total outstanding loan amount per loan agreement.
    columns:
      - name: loan_agreement_id
        description: Primary key for the aggregated loan agreement record.
        tests:
          - not_null
          - unique
      - name: total_outstanding_loan_amt
        description: Sum of outstanding nominal amount per loan agreement.
        tests:
          - not_null