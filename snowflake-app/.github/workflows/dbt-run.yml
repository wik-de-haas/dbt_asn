name: dbt Run

on:
  push:
    paths:
      - "models/**"
      - "macros/**"
      - "dbt_project.yml"
      - "dependencies.yml"
      - ".github/workflows/dbt-run.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "dbt target from profiles.yml"
        required: true
        default: "acc"
        type: choice
        options:
          - acc
          - prod
          - dev
      model_selector:
        description: "Optional dbt --select value (example: mart__loan_to_value+)"
        required: false
        default: ""

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'acc' }}
      DBT_LOCAL_SCHEMA_PREFIX: ci

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_DATABASE_ACC: ${{ secrets.SNOWFLAKE_DATABASE_ACC }}
      SNOWFLAKE_DATABASE_PROD: ${{ secrets.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PATH }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate dbt connection
        run: dbt debug --target "$DBT_TARGET"

      - name: Run selected model(s)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.model_selector != '' }}
        run: dbt run --target "$DBT_TARGET" --select "${{ github.event.inputs.model_selector }}"

      - name: Run all models
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.model_selector == '' }}
        run: dbt run --target "$DBT_TARGET"
